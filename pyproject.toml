[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cognis-logsift"
version = "0.1.1"
description = "Detect brute-force, spray, and anomalous auth events in logs"
authors = [{name = "Cognis Digital", email = "suite@cognis.digital"}]
license = {text = "LicenseRef-COCL-1.0"}
requires-python = ">=3.10"
readme = "README.md"
keywords = ["cognis-digital", "cognis-neural-suite", "tactical", "logsift"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
connect = ["cognis-connect @ git+https://github.com/cognis-digital/cognis-connect.git"]
mcp = ["mcp>=1.0"]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://cognis.digital"
Repository = "https://github.com/cognis-digital/logsift"

[project.scripts]
"logsift-emit" = "logsift.connect:emit_main"
logsift = "logsift.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["logsift"]
